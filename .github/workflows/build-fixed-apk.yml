name: Build fixed release APK (search history focus fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Apply search history focus fix
        run: |
          cat > /tmp/fix.py <<'PYEOF'
          import re, sys
          F = "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/other/SearchScreen.kt"
          s = open(F).read()
          pat = re.compile(
              r"AnimatedContent\(\s*targetState = isContentAtTop,.*?\{ atTop ->\s*Column\(\s*modifier =\s*Modifier\s*\.fillMaxWidth\(\)",
              re.S)
          if len(pat.findall(s)) != 1:
              sys.exit("Patch target not found - upstream code changed")
          s = pat.sub(
              "run {\n            Column(\n                modifier =\n                    Modifier\n"
              "                        .align(Alignment.TopCenter)\n"
              "                        .onGloballyPositioned { searchBarHeightPx = it.size.height }\n"
              "                        .fillMaxWidth()", s)
          s = s.replace("if (atTop) {", "if (isContentAtTop) {", 1)
          open(F, "w").write(s)
          print("Fix applied")

          PYEOF
          python3 /tmp/fix.py

      - name: Make release build self-signed and installable alongside original
        run: |
          cat > /tmp/rel.py <<'PYEOF'
          import sys
          F = "androidApp/build.gradle.kts"
          s = open(F).read()
          old = "        release {\n            isMinifyEnabled = true"
          if s.count(old) != 1:
              sys.exit("Release block not found - upstream build file changed")
          s = s.replace(old,
              "        release {\n"
              "            signingConfig = signingConfigs.getByName(\"debug\")\n"
              "            applicationIdSuffix = \".fix\"\n"
              "            versionNameSuffix = \"-fix\"\n"
              "            isMinifyEnabled = true")
          open(F, "w").write(s)
          print("Release build set to self-signed .fix variant")

          PYEOF
          python3 /tmp/rel.py

      - name: Empty local.properties
        run: touch local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: simpmusic-fixed-release
          path: androidApp/build/outputs/apk/release/*arm64-v8a*.apk
