name: Build fixed fast APK (search history focus fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Apply search history focus fix
        run: |
          cat > /tmp/fix.py <<'PYEOF'
          import re, sys
          F = "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/other/SearchScreen.kt"
          s = open(F).read()
          pat = re.compile(
              r"AnimatedContent\(\s*targetState = isContentAtTop,.*?\{ atTop ->\s*Column\(\s*modifier =\s*Modifier\s*\.fillMaxWidth\(\)",
              re.S)
          if len(pat.findall(s)) != 1:
              sys.exit("Patch target not found - upstream code changed")
          s = pat.sub(
              "run {\n            Column(\n                modifier =\n                    Modifier\n"
              "                        .align(Alignment.TopCenter)\n"
              "                        .onGloballyPositioned { searchBarHeightPx = it.size.height }\n"
              "                        .fillMaxWidth()", s)
          s = s.replace("if (atTop) {", "if (isContentAtTop) {", 1)
          open(F, "w").write(s)
          print("Fix applied")

          PYEOF
          python3 /tmp/fix.py

      - name: Make build non-debuggable (fast) and installable alongside original
        run: |
          cat > /tmp/dbg.py <<'PYEOF'
          import sys
          F = "androidApp/build.gradle.kts"
          s = open(F).read()
          old = '        debug {\n            isMinifyEnabled = false\n            applicationIdSuffix = ".dev"\n            versionNameSuffix = "-dev"'
          if s.count(old) != 1:
              sys.exit("Debug block not found - upstream build file changed")
          s = s.replace(old,
              '        debug {\n            isMinifyEnabled = false\n            isDebuggable = false\n'
              '            applicationIdSuffix = ".fix"\n            versionNameSuffix = "-fix"')
          open(F, "w").write(s)
          print("Debug build set to non-debuggable .fix variant")

          PYEOF
          python3 /tmp/dbg.py

      - name: Empty local.properties
        run: touch local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build APK
        run: ./gradlew androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: simpmusic-fixed-fast
          path: androidApp/build/outputs/apk/debug/*.apk
